#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 6
    gaps_out = 20, 50, 20, 50 
    border_size = 2


    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(545568ff) rgba(545568ff) 0deg
    col.inactive_border = rgba(5959591f)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = true

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 18



    fullscreen_opacity = 1.0
    # Change transparency of focused and unfocused windows
    active_opacity = 1.95
    inactive_opacity = 1.94

    shadow {
        enabled = true
        range = 11
        render_power = 3
        color = rgba(10111950)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size =13
        
        passes = 3



        
       #new_optimizations = true
       # ignore_opacity = true
        
        #xray = false
        
         vibrancy = 0.6696
        
       #noise = 1.13
        contrast = 0.81
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.42, 1.19,    0.46, 1
    bezier = easeInOutCubic, 0.65, 0.12, 0.86, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.27,  0.89,  0.46, 1
    bezier = quick,          0.95, 2,    1.1,  1
    bezier = expressiveFastSpatial, 0.12, 0.67, 0.21, 1.10
    bezier = stall, 3, -1.1, 5.7, 54.15
    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     18.79,  easeOutQuint
    animation = windows,       1,     7.79,  easeOutQuint
    animation = windowsIn,     1,     7.59,   easeOutQuint,  slide
    animation = windowsOut,    1,     14.79,  linear,        slide

    animation = fadeIn,        1,     7.79,  almostLinear
    animation = fadeOut,       1,     4.79,  almostLinear
    animation = fade,          1,     7.79,  quick
    animation = layers,        1,     7.81,  easeOutQuint
    animation = layersIn,      1,     7.79,     easeOutQuint, popin
    animation = layersOut,     1,     7.79,   linear,         popin
    animation = fadeLayersIn,  1,     4.79,  almostLinear
    animation = fadeLayersOut, 1,     4.39,  almostLinear
    animation = workspaces,    1,     9.85,  almostLinear, slide
    animation = workspacesIn,  1,     9.85,  almostLinear, slide
    animation = workspacesOut, 1,     9.85,  almostLinear, slide
    animation = zoomFactor,    1,     7,     quick
}

